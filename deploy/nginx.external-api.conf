# 對外 API 的閘道（docs/adr/0027-api-tokens-external-api.md D9）：整個網域（例 api.example.com）交給 external-api 程序，
# 沒有靜態檔、沒有 /api 前綴、沒有 WebSocket 與 /storage。獨立的 docker 網路（external）：碰不到內部 api。
# 主設定（worker、gzip、server_tokens）沿用 deploy/nginx.main.conf；這裡不 include 前端的 CSP（回應只有 JSON）。

upstream external_api_backend {
  server external-api:3001;
  keepalive 32;
  keepalive_timeout 60s;
}

server {
  # 映像以非 root 執行，不能綁 1024 以下的埠
  listen 8080;
  server_name _;

  # 請求本體只有 JSON（檔案以 presigned URL 直傳租戶網域的 /storage）
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cache-Control "no-store" always;

  location / {
    proxy_pass http://external_api_backend;
    proxy_http_version 1.1;
    # 清掉 Connection 標頭，upstream 的 keepalive 才會生效
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # 對外 API 不以網域決定租戶（租戶在 token 裡），但仍覆寫：不讓客戶端自帶的值流進日誌
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
