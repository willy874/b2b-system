# apps/auth：全平台共用的身分與租戶入口（docs/adr/0019-sso-identity-platform.md）。
# 與 backstage 一樣是純靜態產物＋`/api/*` 反向代理到同一個 NestJS，但是 **獨立的 origin**：
# refresh cookie 是這個 origin 的 host-only cookie，不與其他產品共用（D6，不使用跨域 cookie）。
# 這一版沒有推播與物件儲存，所以沒有 /api/socket.io/ 與 /storage/。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CSP：不允許 inline script（Vite build 產物符合）
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 具 hash 的產物可以長期快取
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # location 裡只要有 add_header，就不會繼承 server 層的 add_header：安全標頭要在這裡再寫一次
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # ★ 去掉 /api 前綴後轉給後端（cookie 的 Path 是 /api/auth）
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    # 同上：登入頁一定要有 frame-ancestors 'none' / X-Frame-Options（防點擊劫持）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }
}
