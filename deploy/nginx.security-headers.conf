# 兩個前端共用的安全標頭（映像裡是 /etc/nginx/snippets/security-headers.conf）。
# nginx 的 add_header 不會從上層繼承到「自己也有 add_header」的 location：那些 location 要再 include 一次。
#
# - CSP：不允許 inline script（Vite build 產物符合）；form-action 限同源（表單不能把資料送到外站）
# - Permissions-Policy：頁面沒有用到相機、麥克風、定位、付款、USB，注入的程式碼也用不到
# - COOP same-origin：其他網站開出來的視窗拿不到這個頁面的 window（登入是頂層跳轉，沒有依賴 window.opener 的 popup）
# - HSTS：TLS 在前面的 LB 終結，瀏覽器經 https 收到才生效；租戶網域是 *.<TENANT_BASE_DOMAIN>，
#   includeSubDomains 只涵蓋各網域自己的子網域。要加 preload 前先確認每個客戶網域都能長期維持 https
# - $file_origin：獨立的檔案網域（deploy/nginx-file-origin.sh，FILE_DOWNLOAD_ORIGIN），沒設定時是空字串
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: $file_origin; media-src 'self' $file_origin; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' $file_origin; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
