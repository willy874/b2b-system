# 兩個前端共用的安全標頭（映像裡是 /etc/nginx/snippets/security-headers.conf）。
# nginx 的 add_header 不會從上層繼承到「自己也有 add_header」的 location：那些 location 要再 include 一次。
#
# - CSP：不允許 inline script（Vite build 產物符合）；form-action 限同源（表單不能把資料送到外站）
# - HSTS：TLS 在前面的 LB 終結，瀏覽器經 https 收到才生效；租戶網域是 *.<TENANT_BASE_DOMAIN>，
#   includeSubDomains 只涵蓋各網域自己的子網域。要加 preload 前先確認每個客戶網域都能長期維持 https
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
