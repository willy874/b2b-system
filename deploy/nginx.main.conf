# 兩個前端映像（backstage、apps/platform）共用的 nginx 主設定：取代映像內建的 /etc/nginx/nginx.conf。
# 映像是 nginxinc/nginx-unprivileged（以 uid 101 執行、listen 8080），所以 pid 與暫存檔都在 /tmp。
# 容量估算見 docs/architecture/01-system.md §4.2：每條 WebSocket 佔兩個連線（client 端 ＋ upstream 端）。

worker_processes auto;
# 每個 worker 可開的檔案數（連線 ＋ 靜態檔）；要 ≥ worker_connections × 2。容器另以 compose 的 ulimits 放寬
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
  # 1000 人各一條 WebSocket ≈ 2000 個連線，加上同時的 HTTP、/storage 的大檔傳輸；留數倍餘裕
  worker_connections 8192;
  multi_accept on;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # 回應與錯誤頁不帶 nginx 版本
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  # 對瀏覽器的 keep-alive；api 的 keepAliveTimeout（65 秒，main.ts）要比 upstream 的 keepalive_timeout（60 秒）長
  keepalive_timeout 65;

  gzip on;
  # 前面的 LB／CDN 會加 Via 標頭；預設 off 時經過它們的回應都不壓縮
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
