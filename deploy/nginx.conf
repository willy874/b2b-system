# 前端是純靜態產物，`/api/*` 反向代理到 NestJS。
# 同源部署讓 refresh token 可以是同源的 httpOnly cookie，不需要 CORS credentials。
# 主設定（worker、gzip、server_tokens）在 deploy/nginx.main.conf；安全標頭在 deploy/nginx.security-headers.conf。

# upstream（api_backend、realtime_backend）由 deploy/nginx-upstreams.sh 在啟動時產生：位址可由環境變數指定、
# 名稱在執行期重新解析（多實例，docs/architecture/01-system.md §7 D12）。對 api 維持長連線（keepalive 64）。

server {
  # 映像以非 root 執行，不能綁 1024 以下的埠
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # 容器的健康檢查（HEALTHCHECK／compose 的 healthcheck）：只接受容器內的連線、不記存取日誌，也不依賴 api 的狀態。
  # 不能用 return：它在 rewrite 階段就回應，allow／deny（access 階段）不會生效
  location = /_nginx_health {
    access_log off;
    allow 127.0.0.1;
    deny all;
    stub_status;
  }

  # 具 hash 的產物可以長期快取
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # location 裡只要有 add_header，就不會繼承 server 層的 add_header：安全標頭要在這裡再 include 一次
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # ★ Socket.io：需要 Upgrade，且連線會長時間閒置（docs/architecture/backend/08-realtime.md §10.2）
  location /api/socket.io/ {
    # 拆開部署時是 realtime 角色的程序（REALTIME_UPSTREAM）；不需要黏著：只用 websocket 傳輸
    proxy_pass http://realtime_backend/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;  # 含 port：api 以它決定租戶（docs/architecture/05-tenancy.md §10.2 D2）
    # 覆寫客戶端自帶的值：api 信任這一跳的 X-Forwarded-Host，不覆寫就能用標頭換租戶
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆寫成單一值：real_ip 已驗過前置 LB（deploy/nginx-real-ip.sh），客戶端自帶的值不會流到 api
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 大於 pingInterval（25s）＋ pingTimeout（20s），心跳之間不會被 nginx 切斷
    proxy_read_timeout 60s;
  }

  # ★ 物件儲存（presigned URL 直傳／下載，docs/architecture/backend/09-file.md §3）
  #   - 不去掉 /storage 前綴、Host 原樣轉發：SigV4 簽的是瀏覽器看到的 host 與完整路徑
  #   - 不緩衝：大檔串流直通。大小上限主要由 api 簽進直傳網址的 Content-Length 決定，
  #     這裡只是縱深防禦：限成瀏覽器實際會送的最大單次請求（單次上傳門檻 FILE_MULTIPART_THRESHOLD 16 MiB、
  #     分塊 FILE_MULTIPART_PART_SIZE 8 MiB）。調大這兩個值（或 FILE_UPLOAD_MAX_SIZE / 10000 超過分塊大小）時要跟著調。
  #     api 自己寫入的影像變體走內網的 FILE_STORAGE_ENDPOINT，不經過這裡（docs/architecture/backend/09-file.md §8）
  location /storage/ {
    proxy_pass http://file-storage:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    #   - 使用者上傳的內容與 backstage 同源：直接開啟的 HTML／SVG 以 sandbox 落在不透明的 origin，
    #     腳本碰不到 refresh cookie 與 API（docs/architecture/backend/09-file.md §7.2）。
    #     換成 S3／MinIO 時這裡是唯一的防線；上游（apps/file-storage）也會送，先隱藏再統一加，不重複。
    #   - location 裡寫了 add_header 就不再繼承 server 層的，其他安全標頭要在這裡重寫
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }

  # ★ 匯入匯出（docs/architecture/backend/22-data-transfer.md §4.2）：分析的上傳檔與套用的 JSON 比一般請求大。
  #   上限是 feature 參數 dataTransfer.importMaxSizeMb 的最大值（50 MB）× 2，由 api 依租戶的實際值再擋一次；
  #   分析是同步的請求（大檔可能要數十秒）。其餘設定同 /api/
  location /api/data-transfers/ {
    proxy_pass http://api_backend/data-transfers/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 101m;
    proxy_read_timeout 120s;
  }

  # ★ 去掉 /api 前綴後轉給後端（cookie 的 Path 是 /api/auth）
  location /api/ {
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    # 清掉 Connection 標頭，upstream 的 keepalive 才會生效
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;  # 含 port：api 以它決定租戶（docs/architecture/05-tenancy.md §10.2 D2）
    proxy_set_header X-Forwarded-Host $http_host;  # 同上：覆寫客戶端自帶的值
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ★ 前端錯誤與 Web Vitals 的收件（apps/apm-service，模擬 Sentry 的 envelope 端點；docs/architecture/07-apm-service.md）
  #   - 同源：CSP 的 connect-src 'self' 不必改（設計決策 D2）；DSN 的路徑是 /apm/<專案 id>
  #   - 只轉發收件端點：上傳 sourcemap、查詢 API 與 /metrics 不經過這裡（apm-service 的 9100 只開在主機的內部介面）
  #   - APM 關閉（APM_ENABLED=false，07-apm-service.md §8.1）時回 404，不轉發
  #   - rewrite 去掉 /apm 前綴；proxy_pass 帶變數：apm-service 的名稱在請求時才解析（resolver 在 deploy/nginx-apm.sh），
  #     APM 關閉、沒有 apm-service 時 nginx 照樣起得來
  location ~ ^/apm/api/[0-9]+/envelope/?$ {
    if ($apm_enabled != "true") {
      return 404;
    }
    set $apm_upstream apm-service:9100;
    rewrite ^/apm(/.*)$ $1 break;
    proxy_pass http://$apm_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # apm-service 的 APM_MAX_ENVELOPE_BYTES 預設 1 MiB
    client_max_body_size 1m;
    proxy_read_timeout 10s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    # 同 /assets/：index.html 一定要有 CSP 與 frame-ancestors（防點擊劫持）
    include /etc/nginx/snippets/security-headers.conf;
  }
}
