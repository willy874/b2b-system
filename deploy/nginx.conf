# 前端是純靜態產物，`/api/*` 反向代理到 NestJS。
# 同源部署讓 refresh token 可以是同源的 httpOnly cookie，不需要 CORS credentials。
# 主設定（worker、gzip、server_tokens）在 deploy/nginx.main.conf；安全標頭在 deploy/nginx.security-headers.conf。

# 對 api 維持長連線：不必每個請求都重新建 TCP（WebSocket 的升級連線不受影響）
upstream api_backend {
  server api:3000;
  keepalive 64;
  keepalive_timeout 60s;
}

server {
  # 映像以非 root 執行，不能綁 1024 以下的埠
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # 具 hash 的產物可以長期快取
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # location 裡只要有 add_header，就不會繼承 server 層的 add_header：安全標頭要在這裡再 include 一次
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # ★ Socket.io：需要 Upgrade，且連線會長時間閒置（docs/architecture/backend/08-realtime.md §10.2）
  location /api/socket.io/ {
    proxy_pass http://api_backend/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;  # 含 port：api 以它決定租戶（ADR-0020 D2）
    # 覆寫客戶端自帶的值：api 信任這一跳的 X-Forwarded-Host，不覆寫就能用標頭換租戶
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 大於 pingInterval（25s）＋ pingTimeout（20s），心跳之間不會被 nginx 切斷
    proxy_read_timeout 60s;
  }

  # ★ 物件儲存（presigned URL 直傳／下載，docs/architecture/backend/09-file.md §3）
  #   - 不去掉 /storage 前綴、Host 原樣轉發：SigV4 簽的是瀏覽器看到的 host 與完整路徑
  #   - 不緩衝、不限大小：大檔串流直通，大小上限由 file-storage 與 api 決定
  location /storage/ {
    proxy_pass http://file-storage:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ★ 去掉 /api 前綴後轉給後端（cookie 的 Path 是 /api/auth）
  location /api/ {
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    # 清掉 Connection 標頭，upstream 的 keepalive 才會生效
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;  # 含 port：api 以它決定租戶（ADR-0020 D2）
    proxy_set_header X-Forwarded-Host $http_host;  # 同上：覆寫客戶端自帶的值
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    # 同 /assets/：index.html 一定要有 CSP 與 frame-ancestors（防點擊劫持）
    include /etc/nginx/snippets/security-headers.conf;
  }
}
