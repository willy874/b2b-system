# 前端是純靜態產物，`/api/*` 反向代理到 NestJS。
# 同源部署讓 refresh token 可以是同源的 httpOnly cookie，不需要 CORS credentials。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CSP：不允許 inline script（Vite build 產物符合）
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 具 hash 的產物可以長期快取
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ★ Socket.io：需要 Upgrade，且連線會長時間閒置（docs/architecture/backend/08-realtime.md §10.2）
  location /api/socket.io/ {
    proxy_pass http://api:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;  # 含 port：api 以它決定租戶（ADR-0020 D2）
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 大於 pingInterval（25s）＋ pingTimeout（20s），心跳之間不會被 nginx 切斷
    proxy_read_timeout 60s;
  }

  # ★ 物件儲存（presigned URL 直傳／下載，docs/architecture/backend/09-file.md §3）
  #   - 不去掉 /storage 前綴、Host 原樣轉發：SigV4 簽的是瀏覽器看到的 host 與完整路徑
  #   - 不緩衝、不限大小：大檔串流直通，大小上限由 file-storage 與 api 決定
  location /storage/ {
    proxy_pass http://file-storage:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    #   - 使用者上傳的內容與 backstage 同源：直接開啟的 HTML／SVG 以 sandbox 落在不透明的 origin，
    #     腳本碰不到 refresh cookie 與 API（SEC-02，docs/architecture/backend/09-file.md §7.2）。
    #     換成 S3／MinIO 時這裡是唯一的防線；上游（apps/file-storage）也會送，先隱藏再統一加，不重複。
    #   - location 裡寫了 add_header 就不再繼承 server 層的，其他安全標頭要在這裡重寫
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # ★ 去掉 /api 前綴後轉給後端（cookie 的 Path 是 /api/auth）
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;  # 含 port：api 以它決定租戶（ADR-0020 D2）
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
