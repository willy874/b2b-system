# apps/platform：全平台共用的身分與租戶入口（docs/architecture/04-sso.md §12）。
# 與 backstage 一樣是純靜態產物＋`/api/*` 反向代理到同一個 NestJS，但是 **獨立的 origin**：
# refresh cookie 是這個 origin 的 host-only cookie，不與其他產品共用（D6，不使用跨域 cookie）。
# 這一版沒有推播與物件儲存，所以沒有 /api/socket.io/ 與 /storage/。
# 主設定（worker、gzip、server_tokens）在 deploy/nginx.main.conf；安全標頭在 deploy/nginx.security-headers.conf。

# upstream（api_backend）由 deploy/nginx-upstreams.sh 在啟動時產生（keepalive 由映像的 API_UPSTREAM_KEEPALIVE=32 決定）。

server {
  # 映像以非 root 執行，不能綁 1024 以下的埠
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # 容器的健康檢查（HEALTHCHECK／compose 的 healthcheck）：只接受容器內的連線、不記存取日誌，也不依賴 api 的狀態。
  # 不能用 return：它在 rewrite 階段就回應，allow／deny（access 階段）不會生效
  location = /_nginx_health {
    access_log off;
    allow 127.0.0.1;
    deny all;
    stub_status;
  }

  # 具 hash 的產物可以長期快取
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # location 裡只要有 add_header，就不會繼承 server 層的 add_header：安全標頭要在這裡再寫一次
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # ★ 去掉 /api 前綴後轉給後端（cookie 的 Path 是 /api/auth）
  location /api/ {
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    # 清掉 Connection 標頭，upstream 的 keepalive 才會生效
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;  # 含 port：api 以它決定租戶（docs/architecture/05-tenancy.md §10.2 D2）
    # 覆寫客戶端自帶的值：api 信任這一跳的 X-Forwarded-Host，不覆寫就能偽造成 apps/platform 或租戶的網域
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆寫成單一值：real_ip 已驗過前置 LB（deploy/nginx-real-ip.sh），客戶端自帶的值不會流到 api
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ★ 前端錯誤與 Web Vitals 的收件（apps/apm-service，模擬 Sentry 的 envelope 端點；docs/architecture/07-apm-service.md）
  #   - 同源：CSP 的 connect-src 'self' 不必改（設計決策 D2）；DSN 的路徑是 /apm/<專案 id>
  #   - 只轉發收件端點：上傳 sourcemap、查詢 API 與 /metrics 不經過這裡（apm-service 的 9100 只開在主機的內部介面）
  #   - APM 關閉（APM_ENABLED=false，07-apm-service.md §8.1）時回 404，不轉發
  #   - rewrite 去掉 /apm 前綴；proxy_pass 帶變數：apm-service 的名稱在請求時才解析（resolver 在 deploy/nginx-apm.sh），
  #     APM 關閉、沒有 apm-service 時 nginx 照樣起得來
  location ~ ^/apm/api/[0-9]+/envelope/?$ {
    if ($apm_enabled != "true") {
      return 404;
    }
    set $apm_upstream apm-service:9100;
    rewrite ^/apm(/.*)$ $1 break;
    proxy_pass http://$apm_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # apm-service 的 APM_MAX_ENVELOPE_BYTES 預設 1 MiB
    client_max_body_size 1m;
    proxy_read_timeout 10s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    # 同上：登入頁一定要有 frame-ancestors 'none' / X-Frame-Options（防點擊劫持）
    include /etc/nginx/snippets/security-headers.conf;
  }
}
