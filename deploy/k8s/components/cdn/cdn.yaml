# 自架的 CDN 邊緣（deploy/cdn.Dockerfile；docs/architecture/backend/09-file.md §16.3）。每個 pod 各有自己的快取（有上限的 emptyDir）：
# 容器重建時快取可以遺失，不影響正確性。清理（cdn.purge）經 headless Service cdn-purge 送到每一個 pod（§16.6）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn
  labels:
    app.kubernetes.io/name: cdn
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cdn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdn
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: b2b-system-cdn
          ports:
            - { name: http, containerPort: 9080 }
            - { name: purge, containerPort: 8081 }
          envFrom:
            - secretRef:
                name: b2b-cdn-secrets
          env:
            # 能以 /storage/<bucket>/<key> 讀到物件的源站：apps/file-storage（FILE_STORAGE_BASE_PATH=/storage），
            # 或在 S3 前面、以 bucket policy 只允許內部網路讀取的閘道（回源憑證只屬於 apps/file-storage；§16.3）
            - name: CDN_ORIGIN_UPSTREAM
              value: https://storage-origin.example.com
            # 比 emptyDir 的 sizeLimit 小一點：nginx 的 cache manager 先淘汰，kubelet 不會因為超過上限而驅逐 pod
            - name: CDN_CACHE_MAX_SIZE
              value: 9g
          # /_nginx_health 只接受容器內的連線：探針以 TCP 確認
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
---
# 對外（Ingress 的 CDN 網域）只有 9080
apiVersion: v1
kind: Service
metadata:
  name: cdn
spec:
  selector:
    app.kubernetes.io/name: cdn
  ports:
    - { name: http, port: 9080, targetPort: http }
---
# 清理用的 headless Service：DNS 回傳每一個 pod 的位址，cdn.purge 逐一送出（§16.6）。不接到 Ingress
apiVersion: v1
kind: Service
metadata:
  name: cdn-purge
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cdn
  ports:
    - { name: purge, port: 8081, targetPort: purge }
