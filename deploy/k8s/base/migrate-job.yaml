# migration ＋ 冪等的 seed：每次部署跑一次，跑完 api 才換新版（docs/architecture/01-system.md §4.2）。
# 不放在 api 的 initContainer：多個 Pod 同時跑 migration 會互搶。由部署流程先 apply 這個 Job、等它完成再更新 Deployment
# （argocd 的 PreSync hook、helm 的 pre-upgrade hook 同理）。migration 一律對上一版相容（docs/architecture/01-system.md §7 D14），
# 舊版 Pod 在新 schema 上照常運作。
apiVersion: batch/v1
kind: Job
metadata:
  name: b2b-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: b2b-migrate
    spec:
      restartPolicy: Never
      # 映像以非 root 的 app 使用者執行（apps/api/Dockerfile）；它是名稱不是數字，不能另設 runAsNonRoot
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: b2b-system-api
          command: ['sh', '-c', 'node dist/src/db/migrate.js && node dist/src/db/seeds/index.js']
          envFrom:
            - configMapRef:
                name: b2b-api-env
            - secretRef:
                name: b2b-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
