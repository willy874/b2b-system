# 內部 api。單體時一個 Deployment 跑所有角色；overlays/cluster 把它改成 http 角色並加上 realtime、worker。
# 探針（docs/architecture/08-monitoring.md §4）：存活 /health；就緒 /health/ready（排空中或平台 DB 連不上回 503）。
# 收到 SIGTERM 後先排空 SHUTDOWN_DRAIN_SECONDS 秒（readiness 503、WebSocket 分批斷線），再收尾背景工作（最多 30 秒）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # 排空（10 秒）＋ 背景工作收尾（30 秒）＋ 餘裕
      terminationGracePeriodSeconds: 60
      # 映像以非 root 的 app 使用者執行（apps/api/Dockerfile）；它是名稱不是數字，不能另設 runAsNonRoot
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: b2b-system-api
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef:
                name: b2b-api-env
            - secretRef:
                name: b2b-api-secrets
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # 影像處理的暫存檔（os.tmpdir()；docs/architecture/backend/09-file.md §5.4）：容器重啟就清掉，設上限
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - { name: http, port: 3000, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
