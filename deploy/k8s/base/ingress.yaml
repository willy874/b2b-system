# 每個租戶一個網域（docs/architecture/05-tenancy.md §7）：租戶網域都到 backstage，apps/platform 的網域到 platform。
# Ingress controller 要：覆寫 X-Forwarded-Host、WebSocket 的 read timeout 大於 60 秒、不設 session affinity
# （推播只用 websocket 傳輸，docs/architecture/backend/08-realtime.md §10.3）。以 ingress-nginx 為例寫在 annotations。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: b2b-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '75'
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
spec:
  ingressClassName: nginx
  rules:
    - host: accounts.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: platform, port: { name: http } }
    # 租戶的萬用網域（*.<TENANT_BASE_DOMAIN>）；客戶自訂的網域另外加
    - host: '*.app.example.com'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backstage, port: { name: http } }
