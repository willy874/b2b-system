# 租戶 DB 的連線池（docs/architecture/backend/02-database.md §6.2 的 PgBouncer 觸發條件）：transaction mode。
# 只有租戶 DB 經過它；平台 DB 維持直連（LISTEN／NOTIFY 與 pg-boss 需要 session 語意）。
# 啟用前，§6.2 列的三處不相容要先處理（prepare: false、逾時改成 ALTER ROLE … SET），然後把各租戶登記的連線字串指向這個服務。
# 設定（databases、使用者清單）依部署而定：放在 Secret b2b-pgbouncer（pgbouncer.ini、userlist.txt）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app.kubernetes.io/name: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.24.1-p1
          args: ['/etc/pgbouncer/pgbouncer.ini']
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            tcpSocket: { port: postgres }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /etc/pgbouncer, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          secret:
            secretName: b2b-pgbouncer
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  selector:
    app.kubernetes.io/name: pgbouncer
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
