# 推播與背景工作（同一個映像，APP_ROLES 不同；docs/features/multi-instance.md §初步構想 1）。
# 連線池依角色調小（§初步構想 5）：推播只查 handshake 與權限集合，worker 依工作的並行度。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-realtime
  labels:
    app.kubernetes.io/name: api-realtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-realtime
    spec:
      # 排空期內分批關閉 WebSocket，客戶端照斷線退避重連到其他 Pod
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: b2b-system-api
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef:
                name: b2b-api-env
            - secretRef:
                name: b2b-api-secrets
          env:
            - { name: APP_ROLES, value: realtime }
            - { name: TENANT_POOL_MAX, value: '3' }
            - { name: PLATFORM_POOL_MAX, value: '3' }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-realtime
  labels:
    app.kubernetes.io/name: api-realtime
spec:
  selector:
    app.kubernetes.io/name: api-realtime
  ports:
    - { name: http, port: 3000, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-worker
  labels:
    app.kubernetes.io/name: api-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-worker
    spec:
      # 執行中的工作最多等 30 秒；逾時的由 pg-boss 在 expireInSeconds 後交給其他 worker
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: b2b-system-api
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef:
                name: b2b-api-env
            - secretRef:
                name: b2b-api-secrets
          env:
            - { name: APP_ROLES, value: worker }
            - { name: TENANT_POOL_MAX, value: '5' }
            - { name: PLATFORM_POOL_MAX, value: '5' }
            # worker 不接流量：不必排空
            - { name: SHUTDOWN_DRAIN_SECONDS, value: '0' }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # 影像變體的暫存檔（docs/architecture/backend/09-file.md §5.4）
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
# 只給 Prometheus 找到每個 worker（不接流量）
apiVersion: v1
kind: Service
metadata:
  name: api-worker
  labels:
    app.kubernetes.io/name: api-worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: api-worker
  ports:
    - { name: metrics, port: 9464, targetPort: metrics }
