# 自架 CDN 的邊緣（docs/architecture/backend/09-file.md §16.3）：nginx ＋ njs（deploy/cdn.js）。
#
#   瀏覽器 ──GET /storage/<bucket>/<key>?exp&kid&sig──▶ :CDN_LISTEN_PORT（驗簽章 → 以路徑查快取）
#                                                         ├─ HIT  → 直接送出
#                                                         └─ MISS → 帶 X-Origin-Auth 向源站讀取 → 存進快取 → 送出
#   cdn.purge（api 的 worker）──POST /_purge──▶ :CDN_PURGE_PORT（只在內部網路；對外的埠沒有這個路徑）
#
# 這是範本：映像啟動時由 deploy/nginx-cdn.sh 檢查 CDN_* 環境變數、以 envsubst 套進 ${CDN_…}，寫到 /tmp/nginx.conf
# （nginx 以 -c 指定；根目錄唯讀）。nginx 自己的變數（$uri 等）不在 envsubst 的清單裡，原樣保留。
# 秘密（簽章金鑰、清理密鑰、回源憑證）不進設定檔：njs 以 process.env 讀（下面的 env 指令）。
# 映像是 nginxinc/nginx-unprivileged（uid 101、listen 1024 以上）；快取在 /var/cache/nginx/cdn（volume 或有上限的 emptyDir）。

load_module modules/ngx_http_js_module.so;

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

env CDN_SIGNING_KEYS;
env CDN_PURGE_SECRET;
env CDN_ORIGIN_SECRET;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # 不記 query string（簽章）；$upstream_cache_status 給驗證與觀察命中率（命中率不進 Grafana，§17 D6）
  log_format cdn '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                 'cache=$upstream_cache_status rt=$request_time';
  access_log /var/log/nginx/access.log cdn;

  js_path /etc/nginx/njs/;
  js_import cdn from cdn.js;
  js_set $cdn_valid cdn.verify;
  js_set $cdn_cache_control cdn.cacheControl;
  js_set $cdn_origin_auth cdn.originAuth;

  # 快取：max_size 滿了以 LRU 淘汰、inactive 期間沒被讀過的自動刪除（§16.6）。路徑與 levels 與 cdn.js 的 CACHE_DIR 相同
  proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:50m max_size=${CDN_CACHE_MAX_SIZE}
                   inactive=${CDN_CACHE_INACTIVE} use_temp_path=off;

  # 源站：名稱在執行期重新解析（多實例、擴縮後跟得上；同 deploy/nginx-upstreams.sh）
  upstream cdn_origin {
    zone cdn_origin 64k;
    resolver ${CDN_RESOLVER} valid=10s ipv6=off;
    server ${CDN_ORIGIN_HOSTPORT} resolve;
    keepalive 32;
    keepalive_timeout 60s;
  }

  server {
    listen ${CDN_LISTEN_PORT};
    server_name _;

    # 容器的健康檢查：只接受容器內的連線，不依賴源站
    location = /_nginx_health {
      access_log off;
      allow 127.0.0.1;
      deny all;
      stub_status;
    }

    location /storage/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Max-Age "86400" always;
        return 204;
      }
      if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
      }
      # 不符或過期一律 403（與影像 API 一致，不另回 410）；快取裡有也不送出
      if ($cdn_valid != "1") {
        return 403;
      }
      # 回應的 Cache-Control 用網址的 exp；查詢參數在下一行就被拿掉，先記下來
      set $cdn_exp $arg_exp;
      # 回源不帶查詢參數：簽章不必給源站，也不讓 response-content-type 之類的參數改寫要被共用的快取內容
      rewrite ^ $uri? break;

      proxy_pass ${CDN_ORIGIN_SCHEME}://cdn_origin;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host ${CDN_ORIGIN_HOSTPORT};
      proxy_ssl_server_name on;
      proxy_ssl_name ${CDN_ORIGIN_HOSTNAME};
      # 瀏覽器的 cookie 與憑證不送到源站；回源憑證只在這一跳（對外的 nginx 會清掉外面帶進來的同名標頭）
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_set_header X-Origin-Auth $cdn_origin_auth;
      proxy_read_timeout 60s;

      # 快取的 key 只有路徑（不含簽章：不同時間窗的網址共用快取）；bucket 一個租戶一個，不同租戶不會共用
      proxy_cache cdn;
      proxy_cache_key $uri;
      # 物件只寫一次：源站回 private 也照樣快取，可以放長；只快取 200（404 不快取，刪除後回源就是 404）
      proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires Vary;
      proxy_cache_valid 200 ${CDN_CACHE_VALID};
      # 同一個物件同時 MISS 時只回源一次
      proxy_cache_lock on;
      proxy_cache_lock_timeout 10s;

      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header x-amz-request-id;
      proxy_hide_header x-amz-id-2;

      add_header Cache-Control $cdn_cache_control always;
      add_header X-Cache-Status $upstream_cache_status always;
      # 與獨立的檔案網域相同的安全標頭（deploy/nginx-file-origin.sh；docs/architecture/backend/09-file.md §13 D4、D5）
      add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    # 其他路徑（含 /_purge）一律 404
    location / {
      return 404;
    }
  }

  # 清理端點：只在內部網路（compose 不發布或只綁 127.0.0.1、k8s 只有 headless Service），對外的埠沒有這些路徑
  server {
    listen ${CDN_PURGE_PORT};
    server_name _;
    # 本體上限 1 MiB（1000 個路徑）；整個留在記憶體，njs 才讀得到 requestText
    client_max_body_size 1m;
    client_body_buffer_size 1m;

    location = /_purge {
      js_content cdn.purge;
    }

    location = /_purge/all {
      js_content cdn.purgeAll;
    }

    location / {
      return 404;
    }
  }
}
