services:
  postgres:
    image: postgres:17-alpine
    container_name: game-editor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameeditor
      POSTGRES_PASSWORD: gameeditor
      POSTGRES_DB: game_editor
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gameeditor -d game_editor']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
