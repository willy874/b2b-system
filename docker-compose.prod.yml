# 生產拓撲的最小可執行範例：nginx（靜態檔 ＋ /api 反向代理）→ api → postgres
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameeditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-game_editor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gameeditor}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-gameeditor}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-game_editor}
      JWT_SECRET: ${JWT_SECRET:?required}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?required}
      REFRESH_COOKIE_PATH: /api/auth
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  postgres-data:
