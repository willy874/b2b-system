pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,jsx,tsx,mjs,cjs,json}'
      run: pnpm oxfmt --check {staged_files}
    lint:
      glob: '*.{js,ts,jsx,tsx,mjs,cjs}'
      run: pnpm oxlint {staged_files}

# commit 時跑太慢，push 時剛好；CI 還會再跑一次（.github/workflows/ci.yml）
pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
